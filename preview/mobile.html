/* ============================================================
   1) تصفير وإعدادات أساسية
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background-color:#f7f4ee;
  color:#4a443c;
  font:16px Almarai, Tahoma, sans-serif;
  font-family:Almarai, Tahoma, sans-serif;
  font-size:16px;
  line-height:1.9;
  min-height:100vh;
  overflow-wrap:break-word;
  word-wrap:break-word;
}
img{max-width:100%;height:auto;border:0;vertical-align:middle}
img[src='']{visibility:hidden}
svg{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#84673a;text-decoration:none;transition:color .2s ease}
a:hover,a:focus{color:#7d6135}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #9c7c48;outline-offset:2px}
h1,h2,h3,h4,h5,h6{
  font-family:Amiri, serif;
  color:#1f1c19;
  line-height:1.4;
  margin:0 0 .7em;
  font-weight:700;
}
p{margin:0 0 1.2em}
hr{border:0;border-top:1px solid #e8e1d5;margin:2em 0}
table{border-collapse:collapse;width:100%;margin:1.5em 0;font-size:.97em}
th,td{border:1px solid #e8e1d5;padding:10px 14px;text-align:start}
th{background:rgba(0,0,0,.03);color:#1f1c19;font-weight:700}
blockquote{
  margin:1.8em 0;
  padding:6px 26px;
  border-inline-start:3px solid #9c7c48;
  font-family:Amiri, serif;
  font-size:1.15em;
  font-style:italic;
  color:#1f1c19;
}
blockquote p:last-child{margin-bottom:0}
code,kbd,pre,samp{font-family:Menlo,Consolas,&quot;Courier New&quot;,monospace;direction:ltr;text-align:left}
code{background:rgba(0,0,0,.045);border-radius:3px;padding:.15em .45em;font-size:.9em}
pre{background:#2b2b2b;color:#f2ede4;border-radius:4px;padding:18px 20px;overflow:auto;font-size:.92em;line-height:1.7}
pre code{background:0 0;padding:0;color:inherit}
.hidden,.invisible,.item-control,.quickedit,.widget-item-control{display:none}
/* احتياطي: شريط بلوجر العلوي في المدوّنات القديمة (لا يظهر في القوالب الحديثة) */
#navbar,#navbar-iframe{display:none}
.status-msg-body,.status-msg-bg{display:none}

/* رابط تجاوز المحتوى */
.skip-link{
  background:#1f1c19;color:#fff;inset-inline-start:12px;padding:10px 18px;position:absolute;
  top:-100px;z-index:9999;transition:top .2s;border-radius:0 0 4px 4px;font-size:14px
}
.skip-link:focus{top:0;color:#fff}

.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:18px}

/* ============================================================
   2) الترويسة
   ============================================================ */
.site-header{
  background:#f7f4ee url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhJ3nfMyAYE9xTKWV2KfARTN7yK1ZWzoJiruXzsY9ETPje4pNWhrOxfkzb4bi9QCXLjMNAW8XYEiN4-A81alCNNr4E5SDUGHCE_UgKuwt7molA8Xv693le038rSQKW_D5TIGgcIvinUXrsue8-1gVVu3BhIO4w_oAeHfq8Fce1xXn09qrBPhaNOlQNeZjE/s1600/1.png) no-repeat scroll center center;
  background-position:center;
  background-repeat:no-repeat;
  background-size:cover;
  border-bottom:1px solid #e8e1d5;
  position:relative;z-index:60
}
/* طبقة شبه شفافة فوق صورة الترويسة: لا تُظهر شيئًا ما لم تُضبط قيمة rgba */
.site-header::before{
  background-color:rgba(247, 244, 238, 0.78);
  content:&quot;&quot;;inset:0;pointer-events:none;position:absolute;z-index:0
}
.site-header&gt;.header-inner,.site-header&gt;.site-nav{position:relative;z-index:1}
.header-inner{padding-block:46px 38px;text-align:center}
.header-logo{display:inline-block;max-width:420px}
.header-logo img{margin-inline:auto;max-height:130px;width:auto}
.header-widget h1,.header-widget .site-title,.header-widget p.site-title{
  font:700 40px Amiri, serif;
  font-family:Amiri, serif;
  font-size:40px;
  letter-spacing:.01em;
  margin:0;
  color:#1f1c19;
}
.header-widget h1 a,.header-widget .site-title a{color:#1f1c19}
.header-widget h1 a:hover,.header-widget .site-title a:hover{color:#84673a}
.site-description{color:#6f695e;font-size:15px;letter-spacing:.04em;margin:12px auto 0;max-width:640px}
.header-ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#9c7c48;margin-top:22px;opacity:.85}
.header-ornament::before,.header-ornament::after{content:&quot;&quot;;height:1px;width:64px;background:currentColor;opacity:.55}
.header-behind{padding:56px 24px;border-radius:2px;background-position:center;background-size:cover;position:relative}
.header-behind::before{content:&quot;&quot;;position:absolute;inset:0;background:rgba(0,0,0,.42)}
.header-behind&gt;*{position:relative;z-index:1;color:#fff}
.header-behind .site-title a{color:#fff}
.header-behind .site-description{color:rgba(255,255,255,.88)}

/* ============================================================
   3) شريط التنقل
   ============================================================ */
.site-nav{
  /* شريط التنقل شفاف ليظهر خلفه صورة الترويسة */
  background:transparent;
  border-bottom:1px solid transparent;
  /* السياق الطبقي للترويسة (.site-header z-index:60) هو ما يرفع الشريط فوق المحتوى */
  position:sticky;top:0;
  transition:background-color .25s ease,box-shadow .25s ease,border-color .25s ease
}
/* عند تمرير الصفحة ووصول الشريط أعلى الشاشة يصبح معتمًا ليظهر فوق المحتوى بوضوح */
.site-nav.is-stuck{
  background:#ffffff;
  border-bottom-color:#e8e1d5;
  box-shadow:0 6px 18px -14px rgba(0,0,0,.35)
}
.nav-inner{
  align-items:center;display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;
  min-height:64px;padding-block:8px;position:relative
}
.nav-toggle-checkbox{display:none}
/* عناصر الدُرج الجانبي (تُستعمل في الجوال فقط) */
.nav-backdrop{display:none}
.nav-drawer-close{display:none}
.nav-toggle{color:#1f1c19;cursor:pointer;display:none;padding:10px}
.site-nav ul{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;list-style:none;margin:0;padding:0}
.site-nav li a{
  border-bottom:2px solid transparent;color:#4a443c;display:block;
  font-size:14.5px;letter-spacing:.02em;padding:18px 15px
}
.site-nav li a:hover,.site-nav li.selected&gt;a{color:#84673a;border-bottom-color:#9c7c48}
.site-nav .widget-title{display:none}
.site-nav .section{align-items:center;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
.site-nav .widget+.widget{border-inline-start:1px solid #e8e1d5;padding-inline-start:16px}
/* البحث داخل .nav-inner: flex-basis:100% يجعله يأخذ سطرًا كاملًا بعرض الصفحة */
.nav-search{
  align-items:center;background:#f7f4ee;border:1px solid #e8e1d5;
  border-radius:999px;display:flex;flex-basis:100%;flex-grow:1;gap:4px;padding:5px;width:100%;
  transition:border-color .25s ease,box-shadow .25s ease
}
.nav-search:focus-within{border-color:#9c7c48;box-shadow:0 0 0 3px rgba(156,124,72,.13)}
.nav-search button{
  align-items:center;background:#9c7c48;border:0;border-radius:50%;color:#fff;cursor:pointer;
  display:flex;flex:0 0 38px;height:38px;justify-content:center;transition:background .2s ease;width:38px
}
.nav-search button:hover{background:#7d6135}
.nav-search svg{height:16px;width:16px;stroke-width:2}
.nav-search input{
  background:0 0;border:0;color:#4a443c;flex:1 1 auto;font:inherit;font-size:15px;
  min-width:0;outline:0;padding:8px 16px;width:auto
}
.nav-search input::placeholder{color:#6f695e}
.search-hint{
  color:#6f695e;flex:0 0 auto;font-size:13px;letter-spacing:.02em;
  opacity:.75;padding-inline-end:18px
}

/* ============================================================
   4) التخطيط العام
   ============================================================ */
.site-main{padding-block:44px 60px}
.layout-grid{align-items:start;display:grid;gap:46px;grid-template-columns:minmax(0,1fr) 320px}
.content-area{min-width:0}
.sidebar{min-width:0}

/* شريط نتائج البحث/الأرشيف/التسميات */
.results-bar{
  align-items:center;background:#ffffff;border:1px solid #e8e1d5;
  border-inline-start:3px solid #9c7c48;display:flex;flex-wrap:wrap;gap:10px;
  justify-content:space-between;margin-bottom:32px;padding:16px 22px
}
.results-bar .results-text{color:#6f695e;font-size:15px}
.results-bar .results-text b,.results-bar .results-text .label{color:#1f1c19}
.results-bar a{font-size:14px;letter-spacing:.02em}

/* ============================================================
   5) قائمة المشاركات (الصفحة الرئيسية والأرشيف)
   ============================================================ */
.post-feed{display:grid;gap:40px}
.post-card{
  background:#ffffff;
  border:1px solid #e8e1d5;
  border-radius:2px;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  overflow:hidden;
  transition:box-shadow .3s ease,transform .3s ease
}
.post-card:hover{box-shadow:0 22px 44px -30px rgba(31,28,25,.45);transform:translateY(-2px)}
.post-card.no-thumb{grid-template-columns:minmax(0,1fr)}
.post-card .post-thumb{background-color:#e8e1d5;display:block;overflow:hidden;position:relative}
.post-card .post-thumb img{aspect-ratio:4/3;height:100%;object-fit:cover;transition:transform .5s ease;width:100%}
.post-card:hover .post-thumb img{transform:scale(1.03)}
.post-card .post-body-wrap{padding:30px 34px 32px}
.post-labels{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 12px;padding:0}
.post-labels a,.post-labels span{
  color:#84673a;font-size:12.5px;letter-spacing:.1em
}
.post-labels a:hover{color:#7d6135}
.post-card .entry-title{font-size:27px;line-height:1.45;margin:0 0 12px;overflow-wrap:anywhere}
.post-card .entry-title a{color:#1f1c19}
.post-card .entry-title a:hover{color:#84673a}
.post-meta{color:#6f695e;display:flex;flex-wrap:wrap;font-size:14px;gap:6px 18px;margin-bottom:14px}
.post-meta span,.post-meta a{align-items:center;color:#6f695e;display:inline-flex;gap:6px}
.post-meta a:hover{color:#84673a}
.post-meta svg{height:15px;width:15px;opacity:.8}
.post-snippet{color:#4a443c;line-height:1.95;margin:0 0 18px;overflow-wrap:anywhere}
.post-snippet p{margin:0}
.post-snippet{-webkit-box-orient:vertical;-webkit-line-clamp:3;display:-webkit-box;overflow:hidden}
.read-more{
  align-items:center;display:inline-flex;font-size:14px;font-weight:700;gap:8px;
  letter-spacing:.04em;min-height:40px
}
.read-more::after{content:&quot;\2190&quot;;font-size:15px;transition:transform .25s ease}
.read-more:hover::after{transform:translateX(-4px)}
html[dir=ltr] .read-more::after{content:&quot;\2192&quot;}
html[dir=ltr] .read-more:hover::after{transform:translateX(4px)}

/* ============================================================
   6) صفحة المشاركة / الصفحة الثابتة
   ============================================================ */
.entry{background:#ffffff;border:1px solid #e8e1d5;padding:46px clamp(20px,4.6vw,58px) 40px}
.entry-header{margin-bottom:26px;text-align:center}
.entry-title{font:700 34px Amiri, serif;font-family:Amiri, serif;font-size:34px;margin:0 0 16px;overflow-wrap:anywhere}
.entry-header .post-meta{justify-content:center}
.entry-header .post-labels{justify-content:center}
.entry-divider{align-items:center;color:#9c7c48;display:flex;gap:12px;justify-content:center;margin:6px 0 26px;opacity:.8}
.entry-divider::before,.entry-divider::after{content:&quot;&quot;;height:1px;width:54px;background:currentColor;opacity:.55}
.entry-content{font-size:17.0px;line-height:2.05;overflow-wrap:anywhere}
.entry-content p{margin-bottom:1.4em}
.entry-content h2,.entry-content h3,.entry-content h4{margin:1.9em 0 .8em}
.entry-content h2{font-size:1.62em;padding-bottom:.28em;position:relative}
.entry-content h2::after{background:#9c7c48;content:&quot;&quot;;height:2px;inset-inline-start:0;position:absolute;bottom:0;width:52px}
.entry-content h3{font-size:1.32em}
.entry-content h4{font-size:1.12em}
.entry-content ul,.entry-content ol{margin:0 0 1.4em;padding-inline-start:1.5em}
.entry-content li{margin-bottom:.5em}
.entry-content img{border-radius:2px;margin:1.6em auto;height:auto}
.entry-content a{border-bottom:1px solid rgba(156,124,72,.35)}
.entry-content a:hover{border-bottom-color:#9c7c48}
.entry-content .separator{margin:1.6em 0}
.entry-content .separator a{border:0}
.entry-content iframe{max-width:100%}
.entry-content .tr-caption,.entry-content figcaption{color:#6f695e;font-size:.86em;font-style:italic;text-align:center}

/* التسميات أسفل المشاركة */
.entry-labels{align-items:center;display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.entry-labels .labels-title{color:#6f695e;font-size:13px;letter-spacing:.06em}
.entry-labels a{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;color:#4a443c;
  display:inline-flex;font-size:13.5px;min-height:38px;padding:5px 16px;transition:all .2s ease
}
.entry-labels a:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}

/* أزرار المشاركة */
.share-box{border-bottom:1px solid #e8e1d5;border-top:1px solid #e8e1d5;margin-top:34px;padding:20px 0}
.share-box .share-title{align-items:center;color:#6f695e;display:flex;font-size:13px;gap:8px;justify-content:center;letter-spacing:.08em;margin-bottom:14px}
.share-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;list-style:none;margin:0;padding:0}
.share-list a{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;color:#4a443c;
  display:inline-flex;font-size:13.5px;min-height:38px;padding:5px 15px;transition:all .2s ease
}
.share-list a:hover{background:#1f1c19;border-color:#1f1c19;color:#fff}

/* صندوق الكاتب */
.author-box{align-items:center;background:rgba(0,0,0,.02);display:flex;gap:20px;margin-top:34px;padding:24px}
.author-box img{border-radius:50%;height:76px;object-fit:cover;width:76px}
.author-box .author-name{color:#1f1c19;font-family:Amiri, serif;font-size:19px;margin:0 0 4px}
.author-box .author-about{color:#6f695e;font-size:14.5px;line-height:1.8;margin:0}

/* التنقل بين المشاركات */
.post-pager{display:grid;gap:1px;grid-template-columns:1fr 1fr;margin-top:34px}
.post-pager a{
  background:rgba(0,0,0,.02);border:1px solid #e8e1d5;color:#4a443c;
  display:block;padding:20px 24px;transition:background .2s ease
}
.post-pager a:hover{background:#ffffff}
.post-pager .pager-label{color:#6f695e;display:block;font-size:13px;letter-spacing:.08em;margin-bottom:6px}
.post-pager .pager-title{color:#1f1c19;font-family:Amiri, serif;font-size:17px;line-height:1.6}

/* ترقيم الصفحات */
.blog-pager{display:flex;gap:14px;justify-content:center;margin-top:44px}

}

/* لا توجد مشاركات */

.no-posts p{color:#6f695e;margin-bottom:22px}

/* ============================================================
   7) الأدوات (الشريط الجانبي وأي مكان آخر)
   ============================================================ */
.widget{background:#ffffff;border:1px solid #e8e1d5;margin-bottom:30px;padding:26px 24px}
.widget .widget-title{
  font:700 19px Amiri, serif;font-family:Amiri, serif;font-size:19px;

}
.widget .widget-title::after{background:#9c7c48;bottom:0;content:&quot;&quot;;height:2px;inset-inline-start:50%;position:absolute;transform:translateX(-50%);width:40px}
.widget .widget-title span{color:#1f1c19}
.widget ul{list-style:none;margin:0;padding:0}
.widget li{margin-bottom:12px}
.widget li:last-child{margin-bottom:0}

/* أدوات HTML/نص */
.widget .widget-content{line-height:1.9;overflow-wrap:anywhere}
.widget .widget-content p:last-child{margin-bottom:0}
.widget-empty{color:#6f695e;font-size:14px;margin:0;text-align:center}

/* الملف الشخصي */
.widget.Profile{text-align:center}
.widget.Profile .profile-img{border-radius:50%;height:104px;margin:0 auto 16px;object-fit:cover;width:104px}
.widget.Profile .default-avatar-wrapper svg{color:#e8e1d5;height:104px;width:104px}
.widget.Profile .profile-name{color:#1f1c19;font-family:Amiri, serif;font-size:20px;margin-bottom:8px}
.widget.Profile .profile-textblock{color:#6f695e;font-size:14.5px;line-height:1.9;margin:0 0 16px}
.widget.Profile .profile-data.location{color:#6f695e;font-size:13.5px;margin-bottom:10px}
.widget.Profile .visit-profile{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;color:#84673a;display:inline-flex;
  font-size:13.5px;letter-spacing:.04em;min-height:38px;padding:6px 20px;transition:all .2s ease
}
.widget.Profile .visit-profile:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}
.widget.Profile .team-list li{align-items:center;display:flex;gap:14px;text-align:start}
.widget.Profile .team-list img{border-radius:50%;height:52px;width:52px}

/* المشاركات الشائعة */
.widget.PopularPosts .popular-item{display:flex;gap:16px;padding-bottom:18px}
.widget.PopularPosts .popular-item+.popular-item{border-top:1px solid #e8e1d5;padding-top:18px}
.widget.PopularPosts .item-thumbnail{background-color:#e8e1d5;flex:0 0 84px}
.widget.PopularPosts .item-thumbnail img{aspect-ratio:1/1;height:84px;object-fit:cover;width:84px}
.widget.PopularPosts .item-title{font-family:Amiri, serif;font-size:16.5px;line-height:1.65;margin:0 0 6px;overflow-wrap:anywhere}
.widget.PopularPosts .item-title a{color:#1f1c19}
.widget.PopularPosts .item-title a:hover{color:#84673a}
.widget.PopularPosts .item-meta{color:#6f695e;font-size:13px}
.widget.PopularPosts .item-number{
  color:#9c7c48;font-family:Amiri, serif;font-size:26px;flex:0 0 34px;line-height:1
}

/* التسميات */
.widget.Label .label-list{display:flex;flex-wrap:wrap;gap:9px}
.widget.Label .label-list li{margin:0}
.widget.Label .label-list a{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;display:inline-flex;
  font-size:13.5px;min-height:36px;padding:4px 14px;transition:all .2s ease
}
.widget.Label .label-list a:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}
.widget.Label .label-count{color:#6f695e;font-size:12px;margin-inline-start:6px}
.widget.Label .cloud-label-widget-content{display:flex;flex-wrap:wrap;gap:9px;line-height:1.6}
.widget.Label .cloud-label-widget-content .label-size{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;display:inline-flex;
  min-height:36px;padding:4px 14px;transition:all .2s ease
}
.widget.Label .cloud-label-widget-content .label-size:hover{background:#9c7c48;border-color:#9c7c48}
.widget.Label .cloud-label-widget-content .label-size:hover a{color:#fff}

/* الأرشيف */
.widget.BlogArchive select{background:#ffffff;border:1px solid #e8e1d5;color:#4a443c;font:inherit;padding:8px 10px;width:100%}
.widget.BlogArchive .archive-list li{align-items:center;display:flex;justify-content:space-between}
.widget.BlogArchive .archive-list a{flex:1}
.widget.BlogArchive .post-count{color:#6f695e;font-size:12.5px;margin-inline-start:8px}
.widget.BlogArchive details summary{cursor:pointer;list-style:none}
.widget.BlogArchive details summary::-webkit-details-marker{display:none}
.widget.BlogArchive .hierarchy{list-style:none;padding-inline-start:0}
.widget.BlogArchive .hierarchy ul{padding-inline-start:1.1em}

/* قائمة الروابط والتنقل */
.LinkList ul li,.PageList ul li{list-style:none}
.widget.LinkList a{border-bottom:1px dashed transparent;display:inline-block;padding-bottom:2px}
.widget.LinkList a:hover{border-bottom-color:#9c7c48}

/* البحث في الشريط الجانبي */
.widget.BlogSearch form{display:flex;gap:8px}
.widget.BlogSearch input[name=q]{
  background:transparent;border:1px solid #e8e1d5;color:#4a443c;
  flex:1;font:inherit;font-size:14.5px;min-width:0;outline:0;padding:9px 14px
}
.widget.BlogSearch input[type=submit],.widget.BlogSearch button{
  background:#1f1c19;border:0;color:#fff;cursor:pointer;font:inherit;font-size:14px;padding:9px 18px
}
.widget.BlogSearch input[type=submit]:hover,.widget.BlogSearch button:hover{background:#9c7c48}

/* الأرشفة والإسناد */
.widget.Attribution{background:0 0;border:0;padding:0}
.widget.Attribution .blogger a{align-items:center;display:inline-flex;gap:8px}
.widget.Attribution svg{height:16px;width:16px}

/* ============================================================
   8) التعليقات
   ============================================================ */
#comments{margin-top:44px}
#comments .comments-title{
  font-family:Amiri, serif;font-size:20px;margin:0 0 24px;padding-bottom:14px;
  position:relative
}

#comments ol{list-style:none;margin:0;padding:0}
#comments .comment-block{border-bottom:1px solid #e8e1d5;padding-bottom:22px}
#comments .comment+.comment .comment-block,#comments .comment .comment .comment-block{border-bottom:0}
#comments .comment-replies{border-inline-start:2px solid #e8e1d5;margin-inline-start:22px;padding-inline-start:22px}
#comments .comment-header{align-items:flex-start;display:flex;gap:14px;margin-bottom:10px}
#comments .avatar-image-container{flex:0 0 42px}
#comments .avatar-image-container img{border-radius:50%;height:42px;width:42px}
#comments .avatar-icon{color:#e8e1d5;height:42px;width:42px}
#comments .comment-author,#comments .comment-author a{color:#1f1c19;font-weight:700}
#comments .datetime,#comments .comment-timestamp a{color:#6f695e;font-size:13px}
#comments .comment-content{color:#4a443c;line-height:1.9}
#comments .comment-content p:last-child{margin-bottom:0}
#comments .comment-actions a,#comments .comment-reply{

}
#comments .comment-actions&gt;*{margin-inline-end:12px}
.comments .comments-content .loadmore{display:none}
.comment-form h4,#comments h3.title{

}
#comment-editor{border:0;margin-top:18px;width:100%}
.comment-footer{margin-top:26px}
#comment-holder .continue{display:none}
.blogger-iframe-colorize{margin-top:16px}
.paging-control-container{color:#6f695e;font-size:14px;margin:18px 0;text-align:center}
.paging-control-container a{margin-inline-end:12px}

/* ============================================================
   9) التذييل
   ============================================================ */
.site-footer{background:#23292f;color:#b8c0c7;margin-top:20px;padding-top:56px}
.site-footer a{color:#ffffff}
.site-footer a:hover{color:#c9a86a}
.footer-widgets{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));padding-bottom:44px}
.site-footer .widget{background:0 0;border:0;margin:0;padding:0}
.site-footer .widget .widget-title{color:#fff;text-align:start}
.site-footer .widget .widget-title span{color:#fff}
.site-footer .widget .widget-title::after{inset-inline-start:0;transform:none;background:#9c7c48}
.site-footer .widget a{color:#ffffff}
.site-footer .widget .label-list a,.site-footer .widget .cloud-label-widget-content .label-size{border-color:rgba(255,255,255,.22);color:#ffffff}
.site-footer .widget .label-list a:hover,.site-footer .widget .cloud-label-widget-content .label-size:hover{background:#9c7c48;border-color:#9c7c48}
.site-footer .widget .label-list a:hover,.site-footer .widget .label-list a:hover *{color:#fff}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.12);color:#b8c0c7;font-size:13.5px;
  padding-block:24px 26px;text-align:center
}
.footer-bottom .footer-note{opacity:.85}
.footer-bottom .Attribution{margin-top:10px}
.to-top{
  align-items:center;background:#9c7c48;border-radius:50%;bottom:26px;color:#fff;display:flex;
  /* z-index أقل من 60 (سياق الترويسة) حتى لا يظهر فوق ستارة دُرج الجوال */
  height:44px;inset-inline-end:24px;justify-content:center;position:fixed;width:44px;z-index:55;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);opacity:.9;transition:opacity .2s ease,transform .2s ease
}
.to-top:hover{color:#fff;opacity:1;transform:translateY(-3px)}
.to-top.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.to-top svg{height:20px;width:20px}

/* ============================================================
   10) إصلاحات بلوجر
   ============================================================ */
.post-body .snippet-thumbnail{float:none;margin:0}
body.item-view .post-body a[imageanchor=&quot;1&quot;]{margin:0 auto!important}
.site-header .widget,.site-nav .widget,#page_body .widget{background:0 0;border:0;margin:0;padding:0}
.icon-close{display:none}
.ornament-diamond{fill:currentColor;stroke:none}
.default-avatar{color:#e8e1d5;height:104px;width:104px}
.profile-image-link{display:inline-block}
.comment-info{flex:1;min-width:0}
.section,.widget{margin:0}
iframe.blogger-iframe-colorize{width:100%}
#comment-editor-src{display:none}
.screen-reader-text{border:0;clip:rect(1px,1px,1px,1px);height:1px;overflow:hidden;position:absolute;width:1px}
#comments,.entry,.post-card{scroll-margin-top:150px}

/* ============================================================
   11) الاستجابة (Responsive)
   ============================================================ */
@media (max-width:1000px){
  .layout-grid{gap:36px;grid-template-columns:minmax(0,1fr)}
  .sidebar{margin-top:8px}
  .nav-inner{justify-content:space-between;min-height:56px;padding-inline:10px}
  .nav-toggle{display:flex}
  /* البحث يبقى فوق الستارة والدُرج فيظلّ قابلًا للاستعمال والقائمة مفتوحة */
  .nav-search{flex-basis:auto;flex-grow:1;position:relative;z-index:50}
  .nav-toggle-checkbox{
    clip-path:inset(50%);display:block;height:1px;opacity:0;overflow:hidden;position:absolute;width:1px
  }
  .nav-toggle-checkbox:focus-visible+.nav-toggle{outline:2px solid #9c7c48;outline-offset:2px}

  /* ===== دُرج القائمة الجانبي ===== */
  /* ستارة معتمة خلف الدُرج: الضغط عليها يغلق القائمة */
  .nav-backdrop{background:rgba(31,28,25,.45);display:none;inset:0;position:fixed;z-index:40}
  .nav-toggle-checkbox:checked~.nav-backdrop{display:block}
  /* الدُرج نفسه: مخفي خارج الشاشة من جهة البداية (يمين في العربية) */
  .site-nav .section{
    background:#ffffff;border-inline-end:1px solid #e8e1d5;
    bottom:0;box-shadow:0 0 46px -20px rgba(0,0,0,.5);display:block;inset-inline-start:0;overscroll-behavior:contain;
    overflow-y:auto;padding:74px 22px 44px;position:fixed;top:0;transform:translateX(-100%);
    transition:transform .3s ease,visibility 0s .3s;visibility:hidden;width:min(320px,86vw);z-index:45
  }
  html[dir=rtl] .site-nav .section{transform:translateX(100%)}
  .nav-toggle-checkbox:checked~.section,
  html[dir=rtl] .nav-toggle-checkbox:checked~.section{
    transform:translateX(0);transition:transform .3s ease,visibility 0s 0s;visibility:visible
  }
  /* قفل تمرير الصفحة ما دام الدُرج مفتوحًا */
  body:has(.nav-toggle-checkbox:checked){overflow:hidden}

  /* محتوى الدُرج */
  .site-nav .widget-title{display:block;margin:0 0 4px;text-align:start}
  .site-nav .widget-title::after{inset-inline-start:0;transform:none;width:34px}
  .site-nav .section ul{display:block;padding:0;width:100%}
  .site-nav .section li a{
    border-bottom:1px solid #e8e1d5;display:block;font-size:16px;padding:14px 2px
  }
  .site-nav .section li:last-child a{border-bottom:0}
  .site-nav .widget+.widget{
    border-inline-start:0;border-top:1px solid #e8e1d5;
    margin-top:22px;padding-inline-start:0;padding-top:22px
  }
  /* عند الفتح: زر ☰ في الشريط يفسح مكانه لزر ✕ داخل الدُرج */
  .nav-toggle-checkbox:checked~.nav-toggle{visibility:hidden}
  .nav-drawer-close{
    align-items:center;background:#ffffff;border:1px solid #e8e1d5;
    border-radius:50%;color:#1f1c19;cursor:pointer;display:flex;height:38px;
    inset-inline-start:calc(min(320px,86vw) - 50px);justify-content:center;opacity:0;position:fixed;
    top:14px;transition:opacity .3s ease,visibility 0s .3s;visibility:hidden;width:38px;z-index:46
  }
  .nav-drawer-close svg{height:16px;width:16px;stroke-width:2}
  .nav-drawer-close:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}
  .nav-toggle-checkbox:checked~.nav-drawer-close{
    opacity:1;transition:opacity .3s ease,visibility 0s 0s;visibility:visible
  }

  /* ===== مسار احتياطي (تُضيفه أسطر الجافاسكربت في نهاية القالب) =====
     يفتح الدُرج بالصنف body.nav-open، فيعمل حتى لو تعذّرت محددات ~ أو :checked */
  body.nav-open{overflow:hidden}
  body.nav-open .nav-backdrop{display:block}
  body.nav-open .site-nav .section,
  html[dir=rtl] body.nav-open .site-nav .section{
    transform:translateX(0);transition:transform .3s ease,visibility 0s 0s;visibility:visible
  }
  body.nav-open .nav-toggle{visibility:hidden}
  body.nav-open .nav-drawer-close{
    opacity:1;transition:opacity .3s ease,visibility 0s 0s;visibility:visible
  }
}
@media (max-width:760px){
  .header-inner{padding-block:34px 28px}
  .entry-content table{display:block;overflow-x:auto;width:100%}
  .post-card{grid-template-columns:minmax(0,1fr)}
  .post-card .post-thumb img{aspect-ratio:16/9}
  .post-card .post-body-wrap{padding:24px 22px 26px}
  .post-card .entry-title{font-size:22px}
  .entry{padding:30px 20px 26px}
  .entry-title{font-size:24.48px}
  .entry-content{font-size:16.0px}
  .post-pager{grid-template-columns:minmax(0,1fr)}
  .author-box{flex-direction:column;text-align:center}
  .site-main{padding-block:30px 40px}
}
@media (max-width:760px){
  .search-hint{display:none}
  .nav-search button{flex:0 0 34px;height:34px;width:34px}
  .nav-search input{font-size:14px;padding:7px 12px}
}
@media (max-width:420px){
  .nav-search button{flex:0 0 32px;height:32px;width:32px}
  .nav-search input{font-size:13.5px;padding:6px 10px}
  .blog-pager{flex-direction:column;align-items:stretch;text-align:center}
  .blog-pager a{display:block}
}

/* ============================================================
   12) الطباعة
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    scroll-behavior:auto!important;transition-duration:.001ms!important
  }
}

@media print{
  .site-nav,.sidebar,.site-footer,.to-top,.share-box,.skip-link,.post-pager,.blog-pager{display:none!important}
  .layout-grid{display:block}
  body{background:#fff;color:#000}
  .entry,.post-card{border:0;box-shadow:none}
  a{color:#000;text-decoration:underline}
}

&lt;Variable name=&quot;posts.title.color&quot; description=&quot;لون العناوين&quot; type=&quot;color&quot; default=&quot;#1f1c19&quot; value=&quot;#1f1c19&quot;/&gt;
&lt;Variable name=&quot;body.text.color&quot; description=&quot;لون النص&quot; type=&quot;color&quot; default=&quot;#4a443c&quot; value=&quot;#4a443c&quot;/&gt;
&lt;Variable name=&quot;muted.color&quot; description=&quot;لون النص الثانوي&quot; type=&quot;color&quot; default=&quot;#6f695e&quot; value=&quot;#6f695e&quot;/&gt;
&lt;Variable name=&quot;border.color&quot; description=&quot;لون الحدود والفواصل&quot; type=&quot;color&quot; default=&quot;#e8e1d5&quot; value=&quot;#e8e1d5&quot;/&gt;
&lt;Variable name=&quot;body.link.color&quot; description=&quot;لون الروابط&quot; type=&quot;color&quot; default=&quot;#84673a&quot; value=&quot;#84673a&quot;/&gt;
&lt;Variable name=&quot;body.link.hover.color&quot; description=&quot;لون الروابط عند المرور&quot; type=&quot;color&quot; default=&quot;#7d6135&quot; value=&quot;#7d6135&quot;/&gt;
&lt;Variable name=&quot;body.text.font&quot; description=&quot;خط النص الأساسي&quot; type=&quot;font&quot; default=&quot;16px Almarai, Tahoma, sans-serif&quot; value=&quot;16px Almarai, Tahoma, sans-serif&quot;/&gt;
&lt;Variable name=&quot;posts.title.font&quot; description=&quot;خط عناوين المشاركات&quot; type=&quot;font&quot; default=&quot;700 34px Amiri, serif&quot; value=&quot;700 34px Amiri, serif&quot;/&gt;
&lt;Variable name=&quot;blog.title.font&quot; description=&quot;خط عنوان المدونة&quot; type=&quot;font&quot; default=&quot;700 40px Amiri, serif&quot; value=&quot;700 40px Amiri, serif&quot;/&gt;
&lt;Variable name=&quot;widget.title.font&quot; description=&quot;خط عناوين الأدوات&quot; type=&quot;font&quot; default=&quot;700 19px Amiri, serif&quot; value=&quot;700 19px Amiri, serif&quot;/&gt;
&lt;Variable name=&quot;footer.background.color&quot; description=&quot;خلفية التذييل&quot; type=&quot;color&quot; default=&quot;#23292f&quot; value=&quot;#23292f&quot;/&gt;
&lt;Variable name=&quot;footer.text.color&quot; description=&quot;نص التذييل&quot; type=&quot;color&quot; default=&quot;#b8c0c7&quot; value=&quot;#b8c0c7&quot;/&gt;
&lt;Variable name=&quot;footer.link.color&quot; description=&quot;روابط التذييل&quot; type=&quot;color&quot; default=&quot;#ffffff&quot; value=&quot;#ffffff&quot;/&gt;
&lt;Variable name=&quot;header.background.color&quot; description=&quot;لون خلفية الترويسة&quot; type=&quot;color&quot; default=&quot;#f7f4ee&quot; value=&quot;#f7f4ee&quot;/&gt;
&lt;Variable name=&quot;header.background&quot; description=&quot;صورة خلفية الترويسة&quot; type=&quot;background&quot; color=&quot;#f7f4ee&quot; default=&quot;#f7f4ee url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhJ3nfMyAYE9xTKWV2KfARTN7yK1ZWzoJiruXzsY9ETPje4pNWhrOxfkzb4bi9QCXLjMNAW8XYEiN4-A81alCNNr4E5SDUGHCE_UgKuwt7molA8Xv693le038rSQKW_D5TIGgcIvinUXrsue8-1gVVu3BhIO4w_oAeHfq8Fce1xXn09qrBPhaNOlQNeZjE/s1600/1.png) no-repeat scroll center center&quot; value=&quot;#f7f4ee url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhJ3nfMyAYE9xTKWV2KfARTN7yK1ZWzoJiruXzsY9ETPje4pNWhrOxfkzb4bi9QCXLjMNAW8XYEiN4-A81alCNNr4E5SDUGHCE_UgKuwt7molA8Xv693le038rSQKW_D5TIGgcIvinUXrsue8-1gVVu3BhIO4w_oAeHfq8Fce1xXn09qrBPhaNOlQNeZjE/s1600/1.png) no-repeat scroll center center&quot;/&gt;
&lt;Variable name=&quot;header.overlay.color&quot; description=&quot;طبقة شبه شفافة فوق صورة الترويسة&quot; type=&quot;color&quot; default=&quot;rgba(247, 244, 238, 0.78)&quot; value=&quot;rgba(247, 244, 238, 0.78)&quot;/&gt;
&lt;Variable name=&quot;layout.width&quot; description=&quot;أقصى عرض للتخطيط&quot; type=&quot;length&quot; min=&quot;900px&quot; max=&quot;1700px&quot; default=&quot;1180px&quot; value=&quot;1180px&quot;/&gt;
&lt;Variable name=&quot;sidebar.width&quot; description=&quot;عرض الشريط الجانبي&quot; type=&quot;length&quot; min=&quot;200px&quot; max=&quot;480px&quot; default=&quot;320px&quot; value=&quot;320px&quot;/&gt;
*/

/* ============================================================
   1) تصفير وإعدادات أساسية
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background-color:#f7f4ee;
  color:#4a443c;
  font:16px Almarai, Tahoma, sans-serif;
  font-family:Almarai, Tahoma, sans-serif;
  font-size:16px;
  line-height:1.9;
  min-height:100vh;
  overflow-wrap:break-word;
  word-wrap:break-word;
}
img{max-width:100%;height:auto;border:0;vertical-align:middle}
img[src='']{visibility:hidden}
svg{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#84673a;text-decoration:none;transition:color .2s ease}
a:hover,a:focus{color:#7d6135}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #9c7c48;outline-offset:2px}
h1,h2,h3,h4,h5,h6{
  font-family:Amiri, serif;
  color:#1f1c19;
  line-height:1.4;
  margin:0 0 .7em;
  font-weight:700;
}
p{margin:0 0 1.2em}
hr{border:0;border-top:1px solid #e8e1d5;margin:2em 0}
table{border-collapse:collapse;width:100%;margin:1.5em 0;font-size:.97em}
th,td{border:1px solid #e8e1d5;padding:10px 14px;text-align:start}
th{background:rgba(0,0,0,.03);color:#1f1c19;font-weight:700}
blockquote{
  margin:1.8em 0;
  padding:6px 26px;
  border-inline-start:3px solid #9c7c48;
  font-family:Amiri, serif;
  font-size:1.15em;
  font-style:italic;
  color:#1f1c19;
}
blockquote p:last-child{margin-bottom:0}
code,kbd,pre,samp{font-family:Menlo,Consolas,&quot;Courier New&quot;,monospace;direction:ltr;text-align:left}
code{background:rgba(0,0,0,.045);border-radius:3px;padding:.15em .45em;font-size:.9em}
pre{background:#2b2b2b;color:#f2ede4;border-radius:4px;padding:18px 20px;overflow:auto;font-size:.92em;line-height:1.7}
pre code{background:0 0;padding:0;color:inherit}
.hidden,.invisible,.item-control,.quickedit,.widget-item-control{display:none}
/* احتياطي: شريط بلوجر العلوي في المدوّنات القديمة (لا يظهر في القوالب الحديثة) */
#navbar,#navbar-iframe{display:none}
.status-msg-body,.status-msg-bg{display:none}

/* رابط تجاوز المحتوى */
.skip-link{
  background:#1f1c19;color:#fff;inset-inline-start:12px;padding:10px 18px;position:absolute;
  top:-100px;z-index:9999;transition:top .2s;border-radius:0 0 4px 4px;font-size:14px
}
.skip-link:focus{top:0;color:#fff}

.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:18px}

/* ============================================================
   2) الترويسة
   ============================================================ */
.site-header{
  background:#f7f4ee url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhJ3nfMyAYE9xTKWV2KfARTN7yK1ZWzoJiruXzsY9ETPje4pNWhrOxfkzb4bi9QCXLjMNAW8XYEiN4-A81alCNNr4E5SDUGHCE_UgKuwt7molA8Xv693le038rSQKW_D5TIGgcIvinUXrsue8-1gVVu3BhIO4w_oAeHfq8Fce1xXn09qrBPhaNOlQNeZjE/s1600/1.png) no-repeat scroll center center;
  background-position:center;
  background-repeat:no-repeat;
  background-size:cover;
  border-bottom:1px solid #e8e1d5;
  position:relative;z-index:60
}
/* طبقة شبه شفافة فوق صورة الترويسة: لا تُظهر شيئًا ما لم تُضبط قيمة rgba */
.site-header::before{
  background-color:rgba(247, 244, 238, 0.78);
  content:&quot;&quot;;inset:0;pointer-events:none;position:absolute;z-index:0
}
.site-header&gt;.header-inner,.site-header&gt;.site-nav{position:relative;z-index:1}
.header-inner{padding-block:46px 38px;text-align:center}
.header-logo{display:inline-block;max-width:420px}
.header-logo img{margin-inline:auto;max-height:130px;width:auto}
.header-widget h1,.header-widget .site-title,.header-widget p.site-title{
  font:700 40px Amiri, serif;
  font-family:Amiri, serif;
  font-size:40px;
  letter-spacing:.01em;
  margin:0;
  color:#1f1c19;
}
.header-widget h1 a,.header-widget .site-title a{color:#1f1c19}
.header-widget h1 a:hover,.header-widget .site-title a:hover{color:#84673a}
.site-description{color:#6f695e;font-size:15px;letter-spacing:.04em;margin:12px auto 0;max-width:640px}
.header-ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#9c7c48;margin-top:22px;opacity:.85}
.header-ornament::before,.header-ornament::after{content:&quot;&quot;;height:1px;width:64px;background:currentColor;opacity:.55}
.header-behind{padding:56px 24px;border-radius:2px;background-position:center;background-size:cover;position:relative}
.header-behind::before{content:&quot;&quot;;position:absolute;inset:0;background:rgba(0,0,0,.42)}
.header-behind&gt;*{position:relative;z-index:1;color:#fff}
.header-behind .site-title a{color:#fff}
.header-behind .site-description{color:rgba(255,255,255,.88)}

/* ============================================================
   3) شريط التنقل
   ============================================================ */
.site-nav{
  /* شريط التنقل شفاف ليظهر خلفه صورة الترويسة */
  background:transparent;
  border-bottom:1px solid transparent;
  /* السياق الطبقي للترويسة (.site-header z-index:60) هو ما يرفع الشريط فوق المحتوى */
  position:sticky;top:0;
  transition:background-color .25s ease,box-shadow .25s ease,border-color .25s ease
}
/* عند تمرير الصفحة ووصول الشريط أعلى الشاشة يصبح معتمًا ليظهر فوق المحتوى بوضوح */
.site-nav.is-stuck{
  background:#ffffff;
  border-bottom-color:#e8e1d5;
  box-shadow:0 6px 18px -14px rgba(0,0,0,.35)
}
.nav-inner{
  align-items:center;display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;
  min-height:64px;padding-block:8px;position:relative
}
.nav-toggle-checkbox{display:none}
/* عناصر الدُرج الجانبي (تُستعمل في الجوال فقط) */
.nav-backdrop{display:none}
.nav-drawer-close{display:none}
.nav-toggle{color:#1f1c19;cursor:pointer;display:none;padding:10px}
.site-nav ul{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;list-style:none;margin:0;padding:0}
.site-nav li a{
  border-bottom:2px solid transparent;color:#4a443c;display:block;
  font-size:14.5px;letter-spacing:.02em;padding:18px 15px
}
.site-nav li a:hover,.site-nav li.selected&gt;a{color:#84673a;border-bottom-color:#9c7c48}
.site-nav .widget-title{display:none}
.site-nav .section{align-items:center;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
.site-nav .widget+.widget{border-inline-start:1px solid #e8e1d5;padding-inline-start:16px}
/* البحث داخل .nav-inner: flex-basis:100% يجعله يأخذ سطرًا كاملًا بعرض الصفحة */
.nav-search{
  align-items:center;background:#f7f4ee;border:1px solid #e8e1d5;
  border-radius:999px;display:flex;flex-basis:100%;flex-grow:1;gap:4px;padding:5px;width:100%;
  transition:border-color .25s ease,box-shadow .25s ease
}
.nav-search:focus-within{border-color:#9c7c48;box-shadow:0 0 0 3px rgba(156,124,72,.13)}
.nav-search button{
  align-items:center;background:#9c7c48;border:0;border-radius:50%;color:#fff;cursor:pointer;
  display:flex;flex:0 0 38px;height:38px;justify-content:center;transition:background .2s ease;width:38px
}
.nav-search button:hover{background:#7d6135}
.nav-search svg{height:16px;width:16px;stroke-width:2}
.nav-search input{
  background:0 0;border:0;color:#4a443c;flex:1 1 auto;font:inherit;font-size:15px;
  min-width:0;outline:0;padding:8px 16px;width:auto
}
.nav-search input::placeholder{color:#6f695e}
.search-hint{
  color:#6f695e;flex:0 0 auto;font-size:13px;letter-spacing:.02em;
  opacity:.75;padding-inline-end:18px
}

/* ============================================================
   4) التخطيط العام
   ============================================================ */
.site-main{padding-block:44px 60px}
.layout-grid{align-items:start;display:grid;gap:46px;grid-template-columns:minmax(0,1fr) 320px}
.content-area{min-width:0}
.sidebar{min-width:0}

/* شريط نتائج البحث/الأرشيف/التسميات */
.results-bar{
  align-items:center;background:#ffffff;border:1px solid #e8e1d5;
  border-inline-start:3px solid #9c7c48;display:flex;flex-wrap:wrap;gap:10px;
  justify-content:space-between;margin-bottom:32px;padding:16px 22px
}
.results-bar .results-text{color:#6f695e;font-size:15px}
.results-bar .results-text b,.results-bar .results-text .label{color:#1f1c19}
.results-bar a{font-size:14px;letter-spacing:.02em}

/* ============================================================
   5) قائمة المشاركات (الصفحة الرئيسية والأرشيف)
   ============================================================ */
.post-feed{display:grid;gap:40px}
.post-card{
  background:#ffffff;
  border:1px solid #e8e1d5;
  border-radius:2px;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  overflow:hidden;
  transition:box-shadow .3s ease,transform .3s ease
}
.post-card:hover{box-shadow:0 22px 44px -30px rgba(31,28,25,.45);transform:translateY(-2px)}
.post-card.no-thumb{grid-template-columns:minmax(0,1fr)}
.post-card .post-thumb{background-color:#e8e1d5;display:block;overflow:hidden;position:relative}
.post-card .post-thumb img{aspect-ratio:4/3;height:100%;object-fit:cover;transition:transform .5s ease;width:100%}
.post-card:hover .post-thumb img{transform:scale(1.03)}
.post-card .post-body-wrap{padding:30px 34px 32px}
.post-labels{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 12px;padding:0}
.post-labels a,.post-labels span{
  color:#84673a;font-size:12.5px;letter-spacing:.1em
}
.post-labels a:hover{color:#7d6135}
.post-card .entry-title{font-size:27px;line-height:1.45;margin:0 0 12px;overflow-wrap:anywhere}
.post-card .entry-title a{color:#1f1c19}
.post-card .entry-title a:hover{color:#84673a}
.post-meta{color:#6f695e;display:flex;flex-wrap:wrap;font-size:14px;gap:6px 18px;margin-bottom:14px}
.post-meta span,.post-meta a{align-items:center;color:#6f695e;display:inline-flex;gap:6px}
.post-meta a:hover{color:#84673a}
.post-meta svg{height:15px;width:15px;opacity:.8}
.post-snippet{color:#4a443c;line-height:1.95;margin:0 0 18px;overflow-wrap:anywhere}
.post-snippet p{margin:0}
.post-snippet{-webkit-box-orient:vertical;-webkit-line-clamp:3;display:-webkit-box;overflow:hidden}
.read-more{
  align-items:center;display:inline-flex;font-size:14px;font-weight:700;gap:8px;
  letter-spacing:.04em;min-height:40px
}
.read-more::after{content:&quot;\2190&quot;;font-size:15px;transition:transform .25s ease}
.read-more:hover::after{transform:translateX(-4px)}
html[dir=ltr] .read-more::after{content:&quot;\2192&quot;}
html[dir=ltr] .read-more:hover::after{transform:translateX(4px)}

/* ============================================================
   6) صفحة المشاركة / الصفحة الثابتة
   ============================================================ */
.entry{background:#ffffff;border:1px solid #e8e1d5;padding:46px clamp(20px,4.6vw,58px) 40px}
.entry-header{margin-bottom:26px;text-align:center}
.entry-title{font:700 34px Amiri, serif;font-family:Amiri, serif;font-size:34px;margin:0 0 16px;overflow-wrap:anywhere}
.entry-header .post-meta{justify-content:center}
.entry-header .post-labels{justify-content:center}
.entry-divider{align-items:center;color:#9c7c48;display:flex;gap:12px;justify-content:center;margin:6px 0 26px;opacity:.8}
.entry-divider::before,.entry-divider::after{content:&quot;&quot;;height:1px;width:54px;background:currentColor;opacity:.55}
.entry-content{font-size:17.0px;line-height:2.05;overflow-wrap:anywhere}
.entry-content p{margin-bottom:1.4em}
.entry-content h2,.entry-content h3,.entry-content h4{margin:1.9em 0 .8em}
.entry-content h2{font-size:1.62em;padding-bottom:.28em;position:relative}
.entry-content h2::after{background:#9c7c48;content:&quot;&quot;;height:2px;inset-inline-start:0;position:absolute;bottom:0;width:52px}
.entry-content h3{font-size:1.32em}
.entry-content h4{font-size:1.12em}
.entry-content ul,.entry-content ol{margin:0 0 1.4em;padding-inline-start:1.5em}
.entry-content li{margin-bottom:.5em}
.entry-content img{border-radius:2px;margin:1.6em auto;height:auto}
.entry-content a{border-bottom:1px solid rgba(156,124,72,.35)}
.entry-content a:hover{border-bottom-color:#9c7c48}
.entry-content .separator{margin:1.6em 0}
.entry-content .separator a{border:0}
.entry-content iframe{max-width:100%}
.entry-content .tr-caption,.entry-content figcaption{color:#6f695e;font-size:.86em;font-style:italic;text-align:center}

/* التسميات أسفل المشاركة */
.entry-labels{align-items:center;display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.entry-labels .labels-title{color:#6f695e;font-size:13px;letter-spacing:.06em}
.entry-labels a{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;color:#4a443c;
  display:inline-flex;font-size:13.5px;min-height:38px;padding:5px 16px;transition:all .2s ease
}
.entry-labels a:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}

/* أزرار المشاركة */
.share-box{border-bottom:1px solid #e8e1d5;border-top:1px solid #e8e1d5;margin-top:34px;padding:20px 0}
.share-box .share-title{align-items:center;color:#6f695e;display:flex;font-size:13px;gap:8px;justify-content:center;letter-spacing:.08em;margin-bottom:14px}
.share-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;list-style:none;margin:0;padding:0}
.share-list a{
  align-items:center;border:1px solid #e8e1d5;border-radius:999px;color:#4a443c;
  display:inline-flex;font-size:13.5px;min-height:38px;padding:5px 15px;transition:all .2s ease
}
.share-list a:hover{background:#1f1c19;border-color:#1f1c19;color:#fff}

/* صندوق الكاتب */
.author-box{align-items:center;background:rgba(0,0,0,.02);display:flex;gap:20px;margin-top:34px;padding:24px}
.author-box img{border-radius:50%;height:76px;object-fit:cover;width:76px}
.author-box .author-name{color:#1f1c19;font-family:Amiri, serif;font-size:19px;margin:0 0 4px}
.author-box .author-about{color:#6f695e;font-size:14.5px;line-height:1.8;margin:0}

/* التنقل بين المشاركات */
.post-pager{display:grid;gap:1px;grid-template-columns:1fr 1fr;margin-top:34px}
.post-pager a{
  background:rgba(0,0,0,.02);border:1px solid #e8e1d5;color:#4a443c;
  display:block;padding:20px 24px;transition:background .2s ease
}
.post-pager a:hover{background:#ffffff}
.post-pager .pager-label{color:#6f695e;display:block;font-size:13px;letter-spacing:.08em;margin-bottom:6px}
.post-pager .pager-title{color:#1f1c19;font-family:Amiri, serif;font-size:17px;line-height:1.6}
.post-pager .next{text-align:end}

/* ترقيم الصفحات */
.blog-pager{display:flex;gap:14px;justify-content:center;margin-top:44px}
.blog-pager a{
  border:1px solid #e8e1d5;color:#1f1c19;font-size:14px;
  letter-spacing:.04em;padding:11px 26px;transition:all .22s ease
}
.blog-pager a:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}

/* لا توجد مشاركات */
.no-posts{background:#ffffff;border:1px solid #e8e1d5;padding:60px 30px;text-align:center}
.no-posts h2{font-size:26px;margin-bottom:10px}
.no-posts p{color:#6f695e;margin-bottom:22px}

/* ============================================================
   7) الأدوات (الشريط الجانبي وأي مكان آخر)
   ============================================================ */
.widget{background:#ffffff;border:1px solid #e8e1d5;margin-bottom:30px;padding:26px 24px}
.widget .widget-title{

/* ============================================================
   11) الاستجابة (Responsive)
   ============================================================ */
@media (max-width:1000px){
  .layout-grid{gap:36px;grid-template-columns:minmax(0,1fr)}
  .sidebar{margin-top:8px}
  .nav-inner{justify-content:space-between;min-height:56px;padding-inline:10px}
  .nav-toggle{display:flex}
  /* البحث يبقى فوق الستارة والدُرج فيظلّ قابلًا للاستعمال والقائمة مفتوحة */
  .nav-search{flex-basis:auto;flex-grow:1;position:relative;z-index:50}
  .nav-toggle-checkbox{
    clip-path:inset(50%);display:block;height:1px;opacity:0;overflow:hidden;position:absolute;width:1px
  }
  .nav-toggle-checkbox:focus-visible+.nav-toggle{outline:2px solid #9c7c48;outline-offset:2px}

  /* ===== دُرج القائمة الجانبي ===== */
  /* ستارة معتمة خلف الدُرج: الضغط عليها يغلق القائمة */
  .nav-backdrop{background:rgba(31,28,25,.45);display:none;inset:0;position:fixed;z-index:40}
  .nav-toggle-checkbox:checked~.nav-backdrop{display:block}
  /* الدُرج نفسه: مخفي خارج الشاشة من جهة البداية (يمين في العربية) */
  .site-nav .section{
    background:#ffffff;border-inline-end:1px solid #e8e1d5;
    bottom:0;box-shadow:0 0 46px -20px rgba(0,0,0,.5);display:block;inset-inline-start:0;overscroll-behavior:contain;
    overflow-y:auto;padding:74px 22px 44px;position:fixed;top:0;transform:translateX(-100%);
    transition:transform .3s ease,visibility 0s .3s;visibility:hidden;width:min(320px,86vw);z-index:45
  }
  html[dir=rtl] .site-nav .section{transform:translateX(100%)}
  .nav-toggle-checkbox:checked~.section,
  html[dir=rtl] .nav-toggle-checkbox:checked~.section{
    transform:translateX(0);transition:transform .3s ease,visibility 0s 0s;visibility:visible
  }
  /* قفل تمرير الصفحة ما دام الدُرج مفتوحًا */
  body:has(.nav-toggle-checkbox:checked){overflow:hidden}

  /* محتوى الدُرج */
  .site-nav .widget-title{display:block;margin:0 0 4px;text-align:start}
  .site-nav .widget-title::after{inset-inline-start:0;transform:none;width:34px}
  .site-nav .section ul{display:block;padding:0;width:100%}
  .site-nav .section li a{
    border-bottom:1px solid #e8e1d5;display:block;font-size:16px;padding:14px 2px
  }
  .site-nav .section li:last-child a{border-bottom:0}
  .site-nav .widget+.widget{
    border-inline-start:0;border-top:1px solid #e8e1d5;
    margin-top:22px;padding-inline-start:0;padding-top:22px
  }
  /* عند الفتح: زر ☰ في الشريط يفسح مكانه لزر ✕ داخل الدُرج */
  .nav-toggle-checkbox:checked~.nav-toggle{visibility:hidden}
  .nav-drawer-close{
    align-items:center;background:#ffffff;border:1px solid #e8e1d5;
    border-radius:50%;color:#1f1c19;cursor:pointer;display:flex;height:38px;
    inset-inline-start:calc(min(320px,86vw) - 50px);justify-content:center;opacity:0;position:fixed;
    top:14px;transition:opacity .3s ease,visibility 0s .3s;visibility:hidden;width:38px;z-index:46
  }
  .nav-drawer-close svg{height:16px;width:16px;stroke-width:2}
  .nav-drawer-close:hover{background:#9c7c48;border-color:#9c7c48;color:#fff}
  .nav-toggle-checkbox:checked~.nav-drawer-close{
    opacity:1;transition:opacity .3s ease,visibility 0s 0s;visibility:visible
  }

  /* ===== مسار احتياطي (تُضيفه أسطر الجافاسكربت في نهاية القالب) =====
     يفتح الدُرج بالصنف body.nav-open، فيعمل حتى لو تعذّرت محددات ~ أو :checked */
  body.nav-open{overflow:hidden}
  body.nav-open .nav-backdrop{display:block}
  body.nav-open .site-nav .section,
  html[dir=rtl] body.nav-open .site-nav .section{
    transform:translateX(0);transition:transform .3s ease,visibility 0s 0s;visibility:visible
  }
  body.nav-open .nav-toggle{visibility:hidden}
  body.nav-open .nav-drawer-close{
    opacity:1;transition:opacity .3s ease,visibility 0s 0s;visibility:visible
  }
}
@media (max-width:760px){
  .header-inner{padding-block:34px 28px}
  .entry-content table{display:block;overflow-x:auto;width:100%}
  .post-card{grid-template-columns:minmax(0,1fr)}
  .post-card .post-thumb img{aspect-ratio:16/9}
  .post-card .post-body-wrap{padding:24px 22px 26px}

  .post-pager{grid-template-columns:minmax(0,1fr)}
  .author-box{flex-direction:column;text-align:center}
  .site-main{padding-block:30px 40px}
}

  .blog-pager a{display:block}
}

/* ============================================================

   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;

  }
}

@media print{

  .layout-grid{display:block}
  body{background:#fff;color:#000}

  a{color:#000;text-decoration:underline}
}
